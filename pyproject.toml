[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metacognisum-capability-gap-controller"
version = "0.1.0a1"
description = "Evidence-grounded intervention selection and persistent capability-gap diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["metacognisum-foresight==0.2.0a1"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/metacognisum/Capability-Gap-Controller"
Issues = "https://github.com/metacognisum/Capability-Gap-Controller/issues"
Documentation = "https://github.com/metacognisum/Capability-Gap-Controller#readme"

[project.scripts]
capability-gap = "capability_gap.cli:main"

[tool.setuptools.packages.find]
include = ["capability_gap*"]
